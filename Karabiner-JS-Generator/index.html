<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karabiner JS Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Karabiner用JS生成ツール</h1>
        <p class="lead-text">アプリの情報を入力してボタンを押すと、Karabiner用のJavaScriptコードを生成します。</p>

        <div class="form-group">
            <label for="bundleId">1. アプリのパッケージ名（Bundle ID）</label>
            <input type="text" id="bundleId" placeholder="ここに入力または貼り付けてください...">
        </div>

        <div class="form-group">
            <label for="fromKey">2. 変更元キー（From）</label>
            <input type="text" id="fromKey" placeholder="例: caps_lock, f2, w">
        </div>
        
<div class="button-group">
            <button id="btn-generate" class="btn btn-primary" onclick="generateJS()">変換する</button>
            <button id="btn-clear" class="btn btn-danger" onclick="clearFields()">クリア</button>
        </div>

        <div class="form-group margin-top-20">
            <label for="output">結果:</label>
            <textarea id="output" readonly placeholder="結果がここに表示されます..."></textarea>
        </div>

        <button id="btn-copy" class="btn btn-success" onclick="copyToClipboard()">コピーする</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
